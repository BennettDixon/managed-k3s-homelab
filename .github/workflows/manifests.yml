# Kube-manifest gate: build every kustomize entry point Flux reconciles and
# schema-validate the output with kubeconform.
#
# Replaces validate-manifests.yml, which never worked:
#   - install step: `curl -s https://install.kubeval.com | bash` — the domain
#     is gone (NXDOMAIN; kubeval is archived upstream) and without `-f` curl
#     pipes an empty stream into bash, which exits 0. The step went green
#     having installed nothing; the next step then died with
#     `kubeval: command not found` (exit 127).
#   - validate step: `kubeval cluster/**/*.yaml` — the tree is clusters/
#     (plural), and the runner's bash has no globstar, so `**` matched
#     nothing either way. It also validated raw files, not the kustomize
#     output Flux actually applies.
#   - a bare pull_request trigger red-Xed every PR, docs-only included.
# The old file is left untouched here because in-flight PRs already delete
# it; a new filename means zero merge conflicts in either merge order.
name: manifests
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "clusters/**"
      - ".github/workflows/manifests.yml"
  pull_request:
    paths:
      - "apps/**"
      - "infrastructure/**"
      - "clusters/**"
      - ".github/workflows/manifests.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: v5.8.1
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned kustomize + kubeconform
        # -fsSL, not -s: a dead URL must fail this step loudly instead of
        # piping nothing (the exact failure mode of the old workflow).
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
          kustomize version
          kubeconform -v

      - name: Build and validate every Flux entry point
        run: |
          set -euo pipefail

          # Community CRD catalog: resolves the repo's CRs (HelmRelease,
          # HelmRepository, ExternalSecret, ServiceMonitor, PrometheusRule,
          # Flux Kustomization, ...) so they are validated, not skipped.
          crd_schemas='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

          # -strict: reject unknown fields (catches indentation drift such as
          #   labels beside metadata instead of under it).
          # -ignore-missing-schemas: a kind absent from both schema sets must
          #   not fail the gate — a missing schema is not a manifest bug, but
          #   an INVALID manifest always fails. As of adding this workflow
          #   nothing is skipped: every kind in the tree resolves a schema.
          # Flux postBuild placeholders (${VAR} inside string values) are
          #   ordinary strings to schema validation and pass through.
          validate() {
            kubeconform -strict -summary \
              -schema-location default \
              -schema-location "$crd_schemas" \
              -ignore-missing-schemas "$@"
          }

          # The hand-edited Flux Kustomization objects themselves: a typo
          # here wedges reconciliation cluster-wide (wait+dependsOn chain).
          echo "=== clusters/ Flux Kustomization objects"
          validate clusters/*/apps.yaml clusters/*/infrastructure.yaml

          # Discover what Flux actually reconciles: every spec.path under
          # clusters/ that points into apps/ or infrastructure/. The
          # flux-system self-reference (path: ./clusters/<name>) is excluded:
          # gotk-components.yaml is generated by flux bootstrap, not
          # hand-edited. New Flux Kustomizations are picked up automatically.
          entries=$(grep -rhoE 'path: \./(apps|infrastructure)/[A-Za-z0-9/_.-]+' clusters/ | sed 's|path: \./||' | sort -u)
          echo "=== entry points"
          echo "$entries"

          fail=0
          for d in $entries; do
            echo "=== $d"
            # Flux auto-generates a kustomization for plain-manifest dirs
            # (apps/namespaces today); replicate so CI builds what Flux builds.
            if [ ! -f "$d/kustomization.yaml" ] && [ ! -f "$d/kustomization.yml" ]; then
              (cd "$d" && kustomize create --autodetect --recursive)
            fi
            # LoadRestrictionsNone matches Flux's kustomize-controller;
            # apps/overlays/personal-site legitimately reaches ../templates,
            # which kustomize's default restrictor rejects.
            kustomize build --load-restrictor=LoadRestrictionsNone "$d" | validate || fail=1
          done
          exit "$fail"
