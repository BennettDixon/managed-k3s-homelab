---
# Setup namespaces first
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-namespaces
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infra-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/namespaces
  prune: true
  wait: true
  timeout: 5m0s
---
# Setup app secrets after infra is setup (secrets manager is ready)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: app-namespaces
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/secrets
  prune: true
  wait: true
  timeout: 5m0s
---
# SETUP APP OVERLAYS NEXT
# Setup personal-site overlays
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: personal-site-overlay
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: app-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/overlays/personal-site
  prune: true
  wait: true
  timeout: 5m0s
---
######
# ADD MORE OVERLAYS AS NEEDED
######

# Setup apps after secrets are setup
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: app-secrets
    - name: personal-site-overlay
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/homelab-prod
  prune: true
  wait: true
  timeout: 5m0s
  # Failed reconciles (missing CRD during bootstrap, transient unreadiness)
  # retry at 2m instead of waiting out the full 10m interval.
  retryInterval: 2m0s
  # Values that must exist on-cluster but never in this public repo
  # (ts.net FQDNs — decision 2026-08-30). The secret is created once,
  # out of band: see docs/runbooks/jobs-mcp.md. `optional: true` so a
  # missing secret degrades that one substitution instead of wedging
  # the whole apps chain. NOTE: this puts every manifest under
  # apps/homelab-prod through bash-style envsubst — a future manifest
  # embedding literal ${...} (shell scripts in ConfigMaps, dashboard
  # JSON) must carry the annotation
  # `kustomize.toolkit.fluxcd.io/substitute: disabled` to opt out.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
        optional: true
