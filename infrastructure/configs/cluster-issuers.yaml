---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    # Replace the email address with your own contact email
    email: hi@bennettdixon.dev
    # The server is replaced in /clusters/homelab-prod/infrastructure.yaml
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-nginx
    solvers:
      - http01:
          ingress:
            class: nginx
---
# For internal services (.internal domains) that can't use Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# Long-lived self-signed root CA for internal services. Leaf certs are
# issued from this root (via the homelab-ca issuer below), so routine leaf
# rotations no longer break clients: clients trust the stable root once
# instead of pinning each rotating leaf.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab-root-ca
  subject:
    organizations:
      - homelab
  secretName: homelab-root-ca
  # 10 years. cert-manager re-issues the root at 2/3 of the duration
  # (~2033); re-run the one-time trust distribution when that happens
  # (see scripts/distribute-harbor-ca.sh).
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# Issues certificates signed by the homelab root CA above. Use this for
# internal (.internal domains) services instead of the bare selfsigned
# issuer so served leafs chain to a stable, distributable root.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca
spec:
  ca:
    secretName: homelab-root-ca
