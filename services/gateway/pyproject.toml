[project]
name = "gateway"
# The version-bump CI guard (.github/workflows/gateway.yml) reads this field:
# an image-affecting change must move it together with src/gateway/__init__.py
# and, once slice 2 lands, the tag in apps/base/gateway/deployment.yaml.
version = "0.1.0"
description = "Model gateway: OpenAI-compatible chat completions under a per-project budget ledger (spec docs/specs/gateway.md)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "anthropic>=1.4.0,<2",
  "starlette>=1.6.0,<2",
  "uvicorn>=0.52.4,<1",
  "pydantic>=2.13.5,<3",
  "prometheus-client>=0.26.0,<1",
  "pyyaml>=6.0.3,<7",
]

[project.scripts]
gateway = "gateway.main:main"
gateway-smoke-local = "gateway.smoke_local:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "hypothesis>=6.168.0,<7",
  "httpx>=0.28.1,<1",
  "ruff>=0.16.6,<1",
  "mypy>=2.3.1,<3",
  "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PL"]
ignore = [
  "S101",    # assert: used in tests and as internal invariant checks
  "PLR2004", # magic numbers: money constants are documented inline
  "PLR0913", # many arguments: ledger transitions carry the row's columns
  "PLR0912", "PLR0915", "PLR0911", # branchy validation/translation code, kept flat on purpose
  "C901",
  "N818",    # BudgetRefusal / JobCapMismatch / ClockGuardTripped are the spec's names
  "RUF002",  # × in money docstrings is the spec's notation
  "PLR0917", # positional dataclass-style helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR", "B011", "E501", "SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/gateway", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
