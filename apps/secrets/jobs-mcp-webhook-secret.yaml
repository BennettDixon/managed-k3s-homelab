# Shared secret carried on every jobs-mcp -> n8n webhook call; workflows
# verify it in their first node (spec §6, v1-mandatory).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jobs-mcp-webhook-secret
  namespace: jobs-mcp
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: jobs-mcp-webhook-secret
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: k3s_jobs_mcp_webhook_secret
        property: secret
