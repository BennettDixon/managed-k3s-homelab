# Bearer credential Alertmanager presents on every webhook POST to the n8n
# alerts workflow, which verifies it against $env.ALERTS_WEBHOOK_SECRET in its
# first node (docs/runbooks/alerts.md). Mounted into Alertmanager via
# alertmanagerSpec.secrets in kube-prometheus-stack-values.yaml. Prod-only ON
# PURPOSE (unlike the jobs-mcp in-base ExternalSecrets, whose base is excluded
# from apps/development — this base is not): keeps the prod bearer off any dev
# cluster and keeps a missing-SM-entry failure out of dev's chain entirely.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alerts-webhook-secret
  namespace: kube-prometheus-stack
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alerts-webhook-secret
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: k3s_alerts_webhook_secret
        property: secret
