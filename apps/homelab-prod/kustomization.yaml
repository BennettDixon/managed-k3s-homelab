apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - harbor-ui-ingress.yaml
  - alerts-webhook-secret.yaml
  - ../base/harbor
  - ../base/kube-prometheus-stack
  - ../base/jupyterhub
  - ../base/tailscale
  - ../base/personal-site
  - ../base/jobs-mcp
  # Prod-only on purpose (spec §8): in-base ExternalSecrets — never in
  # apps/development.
  - ../base/knowledge-mcp
  # Prod-only on purpose (gateway spec §8): in-base ExternalSecrets carrying
  # the first dollar-spending credential — never in apps/development.
  - ../base/gateway
patches:
  - path: harbor-values.yaml
    target:
      kind: HelmRelease
      name: harbor
  - path: kube-prometheus-stack-values.yaml
    target:
      kind: HelmRelease
      name: kube-prometheus-stack
  - path: jupyterhub-values.yaml
    target:
      kind: HelmRelease
      name: jupyterhub
  - path: tailscale-values.yaml
    target:
      kind: HelmRelease
      name: tailscale
