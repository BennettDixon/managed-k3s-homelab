apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: tailscale
spec:
  releaseName: tailscale-operator
  chart:
    spec:
      # Pinned => update manually
      version: 1.78.3
  valuesFrom:
    - kind: Secret
      name: tailscale-oauth-client
      valuesKey: client_id
      targetPath: oauth.clientId
    - kind: Secret
      name: tailscale-oauth-client
      valuesKey: client_secret
      targetPath: oauth.clientSecret
  values:
    # Expose the Kubernetes API server on the tailnet so kubectl works via
    # the context from `tailscale configure kubeconfig tailscale-operator`.
    # Chart default is "false", which leaves nothing listening on :443 of
    # the tailscale-operator device (connections are refused).
    apiServerProxyConfig:
      mode: "true"
    