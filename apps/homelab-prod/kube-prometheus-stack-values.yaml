# Prod-only Alertmanager receiver wiring (docs/runbooks/alerts.md). Lives here
# rather than in the base because apps/development consumes the same base: the
# receiver config would point dev at a jobs-mcp egress Service that doesn't
# exist there, and the secret mount would wedge dev's alertmanager pod when the
# ExternalSecret (also prod-only, alerts-webhook-secret.yaml) can't sync.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: kube-prometheus-stack
spec:
  chart:
    spec:
      # Pinned => update manually. The receiver config below inherits the
      # chart's default global/inhibit_rules/templates, so an unpinned major
      # bump could silently change routing/inhibition semantics.
      version: 88.6.2
  values:
    # Storage lives in this PROD patch, not the shared base: `local-path` is
    # THIS cluster's default class, and apps/development consumes the same
    # base. A storageClassName that does not exist on a cluster leaves the
    # claim Pending, the StatefulSet short of ready replicas, and the `apps`
    # Kustomization (wait: true) stalled — the alerts-review lesson.
    prometheus:
      prometheusSpec:
        # Was chart-default: no storageSpec at all, i.e. an emptyDir on the
        # node filesystem. Every pod recreation discarded the whole TSDB, and
        # nothing capped its growth on a node that is ~73% full.
        #
        # This is NOT new disk usage: emptyDir already lived on that same
        # filesystem. It converts anonymous, uncapped, disposable node-disk
        # into a named claim that survives a restart and has a hard ceiling.
        retention: 10d
        # retentionSize is the REAL cap, not the claim: local-path is a
        # hostPath provisioner and does not enforce the requested size (the
        # jobs-mcp 1Gi claim is unenforced the same way, STATUS 2026-09-01).
        # Prometheus applies it to persisted blocks only — the WAL and
        # head are extra — so it sits well under the claim. Blocks measured
        # 3.19 GiB at 10d on 2026-09-03, so 8GiB is roughly 2.5x headroom
        # while capping worst-case growth at a quarter of the node's free
        # space rather than all of it.
        retentionSize: 8GiB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    alertmanager:
      alertmanagerSpec:
        # Mounts the ExternalSecret-synced Secret at
        # /etc/alertmanager/secrets/alerts-webhook-secret/ so the receiver
        # auth value never appears in these values (repo is public).
        secrets:
          - alerts-webhook-secret
        # Also chart-default emptyDir until now. Small but not disposable:
        # this is where silences and the notification log live, so a pod
        # recreation un-silences everything an operator had silenced and
        # can re-notify for alerts already sent. 1Gi is far more than the
        # KiB these actually occupy; the floor is the smallest claim worth
        # naming.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
      # Helm merge semantics: the receivers and route.routes LISTS replace the
      # chart defaults wholesale (so the default Watchdog null-route is
      # re-declared here); `route` itself merges per-key, and every default
      # key is re-declared below to keep the result explicit.
      # global/inhibit_rules/templates still inherit chart defaults.
      config:
        route:
          receiver: n8n-alerts
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            # Decision 2026-09-01: phyt-system is another project's workload
            # (orphaned from git; its stuck minio-bucket-setup job keeps
            # KubeJobNotCompleted firing). Muted, not fixed — still visible
            # in Prometheus. Delete this route when that project gets
            # attention.
            - receiver: "null"
              matchers:
                - namespace = "phyt-system"
        receivers:
          - name: "null"
          - name: n8n-alerts
            webhook_configs:
              # Rides jobs-mcp's operator egress Service (ExternalName ->
              # tailnet n8n) rather than running a second egress proxy for
              # the same target. Accepted coupling: alert delivery depends
              # on the jobs-mcp namespace existing — documented in
              # docs/runbooks/alerts.md.
              - url: http://n8n.jobs-mcp.svc.cluster.local:5678/webhook/alerts
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alerts-webhook-secret/secret
