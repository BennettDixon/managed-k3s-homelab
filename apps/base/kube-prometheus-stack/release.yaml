apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: kube-prometheus-stack
spec:
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
  interval: 50m
  install:
    remediation:
      retries: 3
  values:
    # k3s embeds kube-proxy/scheduler/controller-manager in the server
    # process — there are no separate endpoints to scrape, so the chart's
    # default monitors made KubeProxyDown/KubeSchedulerDown/
    # KubeControllerManagerDown fire permanently. Disabling the component
    # monitors removes the scrape targets AND their default rules.
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    alertmanager:
      alertmanagerSpec:
        # Mounts the ExternalSecret-synced Secret at
        # /etc/alertmanager/secrets/alerts-webhook-secret/ so the receiver
        # auth value never appears in these values (repo is public).
        secrets:
          - alerts-webhook-secret
      # Helm list semantics: this REPLACES the chart's default route/receivers
      # wholesale, so the default Watchdog null-route is re-declared here.
      # global/inhibit_rules/templates still inherit chart defaults.
      config:
        route:
          receiver: n8n-alerts
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            # Decision 2026-09-01: phyt-system is another project's workload
            # (orphaned from git; its stuck minio-bucket-setup job keeps
            # KubeJobNotCompleted firing). Muted, not fixed — still visible
            # in Prometheus. Delete this route when that project gets
            # attention.
            - receiver: "null"
              matchers:
                - namespace = "phyt-system"
        receivers:
          - name: "null"
          - name: n8n-alerts
            webhook_configs:
              # Rides jobs-mcp's operator egress Service (ExternalName ->
              # tailnet n8n) rather than running a second egress proxy for
              # the same target. Accepted coupling: alert delivery depends
              # on the jobs-mcp namespace existing — documented in
              # docs/runbooks/alerts.md.
              - url: http://n8n.jobs-mcp.svc.cluster.local:5678/webhook/alerts
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alerts-webhook-secret/secret
