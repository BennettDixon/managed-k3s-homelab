# Bearer credential Alertmanager presents on every webhook POST to the n8n
# alerts workflow, which verifies it against $env.ALERTS_WEBHOOK_SECRET in its
# first node (docs/runbooks/alerts.md). Mounted into Alertmanager via
# alertmanagerSpec.secrets in release.yaml. Lives in this base, not
# apps/secrets/, for the same reason as the jobs-mcp ExternalSecrets: scope a
# missing-SM-entry failure to the apps stage of the prod chain only.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alerts-webhook-secret
  namespace: kube-prometheus-stack
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alerts-webhook-secret
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: k3s_alerts_webhook_secret
        property: secret
