apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jobs-mcp
  namespace: jobs-mcp
  labels:
    # Without this label the default-valued kube-prometheus-stack silently
    # ignores the monitor (spec §9).
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: jobs-mcp
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
