# Task-type registry (spec §4). Repo-owned; shipped via configMapGenerator so
# any change here hash-rolls the Recreate Deployment — a merged registry PR
# takes effect declaratively. Governance: a new task_type is one PR carrying
# this entry AND the canonical workflow export in n8n/.
task_types:
  smoke-heartbeat:
    executor: n8n
    webhook_path: jobs/smoke-heartbeat
    timeout_s: 300
    max_attempts: 3
    idempotent: true
    frontend_allowed: false
    payload_schema:
      type: object
      additionalProperties: false
  knowledge-reingest:
    # Scheduled freshness for knowledge-mcp (knowledge spec §6). The n8n
    # executor's ONLY action is one MCP `reingest` call with the scoped
    # n8n-reingest token — it fetches nothing, parses nothing, holds no
    # content; n8n compromise buys "re-index the public repo". Callers send
    # budget_cap: 0 (the executor can spend nothing regardless — no model
    # path exists) and artifacts_out: [] (the executor reports no artifacts,
    # so any declared one fails the job as artifacts_missing). Idempotent by
    # construction: reingest re-fetches every doc and re-indexes only what
    # changed (sha-keyed). timeout_s stays ABOVE the executor's own HTTP
    # timeout (150 s in the workflow) so a slow GitHub night fails inside n8n
    # with a visible execution error instead of an orphaned execution.
    executor: n8n
    webhook_path: jobs/knowledge-reingest
    timeout_s: 180
    max_attempts: 3
    idempotent: true
    frontend_allowed: false
    payload_schema:
      type: object
      additionalProperties: false
      required: [corpus]
      properties:
        corpus:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
  gateway-smoke:
    # The jobs-mcp §11 proof (gateway spec §14 slice 3): the first task type that
    # spends, with zero jobs-mcp code changes. The n8n executor reads the job's
    # gateway ledger, then makes at most one 64-token Haiku call on the
    # `gateway-smoke` project with the class-scoped n8n-executor token
    # ($env.GATEWAY_EXECUTOR_TOKEN: one project, job id mandatory, $0.10 per
    # request, the project's $1/month cap). The job's budget_cap becomes the
    # gateway job cap, pinned by the first attempt: it must be in [0, 0.10]
    # (the executor refuses more; the gateway would), `0` and any cap below one
    # reservation (~$0.0004) are refused at the gateway with E_BUDGET_EXCEEDED
    # scope=job, and nothing is spent. On success the executor reports
    # `spent_usd` = the job's cumulative list-equivalent USD from the gateway —
    # non-null for the first time in jobs-mcp's history.
    # idempotent: true by the ledger-read rule (gateway spec §11): a retry never
    # spends again. It also never reports success without a completion it saw —
    # a job already charged fails with prior_attempt_charged, and the gateway
    # ledger (/ledger/jobs/{id}?caller=n8n-executor) holds that spend.
    # max_attempts 3: a refusal fails fast at $0 each time, and a retry that
    # meets an earlier attempt's reservation still in flight gets another go.
    # timeout_s 120 stays ABOVE the workflow's sequential HTTP budget (15 s ledger
    # read + 75 s call), and the call's 75 s is ABOVE the gateway's real bound
    # for X-Gateway-Timeout-S 20 (10 s count_tokens + 2 x (20 + 5) s + one 10 s
    # retry delay = 70 s), so a slow provider fails inside the gateway, then
    # inside n8n, and never as an orphaned execution. The prompt is capped at
    # 512 characters, which is always within the spec's 2 KiB of UTF-8.
    executor: n8n
    webhook_path: jobs/gateway-smoke
    timeout_s: 120
    max_attempts: 3
    idempotent: true
    frontend_allowed: false
    payload_schema:
      type: object
      additionalProperties: false
      properties:
        model:
          type: string
          enum: [haiku]
        prompt:
          type: string
          minLength: 1
          maxLength: 512
