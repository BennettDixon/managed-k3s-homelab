# Starter alerts (spec §9). Delivery: Alertmanager -> n8n webhook receiver
# (docs/runbooks/alerts.md).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jobs-mcp
  namespace: jobs-mcp
  labels:
    # Without this label the default-valued kube-prometheus-stack silently
    # ignores the rule — same trap as the ServiceMonitor (spec §9).
    release: kube-prometheus-stack
spec:
  groups:
    - name: jobs-mcp.rules
      rules:
        - alert: JobsMcpMetricsAbsent
          # Instant-vector alerts silently disarm when the series vanishes
          # (deployment deleted/scaled to 0, Service selector drift, monitor
          # release-label lost — a trap this repo has hit twice). This guard
          # fires precisely then. TargetDown covers scrape-failing; this
          # covers target-gone. for: 10m absorbs Recreate-deploy staleness.
          expr: absent(jobs_bridge_up{namespace="jobs-mcp"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "jobs-mcp metrics have vanished from Prometheus"
            description: >-
              No jobs_bridge_up series exists: the jobs-mcp scrape target is
              gone (not merely failing — TargetDown covers that). Check the
              Deployment, the Service's app label, and the ServiceMonitor's
              release label. While this fires, every other jobs-mcp alert is
              blind.
        - alert: JobsBridgeDown
          expr: jobs_bridge_up{namespace="jobs-mcp"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "jobs-mcp dispatch attempts to the n8n bridge are failing"
            description: >-
              Connection-level attempts to the n8n bridge have failed for 10
              minutes. Dispatch is frozen with backoff; enqueue still works and
              nothing is failed by bridge downtime (spec §5). Checklist:
              docs/runbooks/jobs-mcp.md "Bridge down". The gauge is refreshed
              even on an idle queue by the periodic connection-level probe
              (spec §9, BRIDGE_PROBE_INTERVAL_MS, default 60s), so a bridge that
              dies or recovers while idle is detected within roughly one probe
              interval plus the current backoff window — not only when the next
              job flows. With the probe disabled (interval 0) the old
              event-driven caveats return: on an idle queue a dead bridge stays
              UNDETECTED until work arrives, and if queued jobs were canceled
              during an outage the gauge can stay 0 after the bridge recovers,
              until the next successful dispatch clears it.
        - alert: JobsQueueStalled
          expr: jobs_queue_oldest_age_seconds{namespace="jobs-mcp"} > 1800
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "oldest queued job is over 30 minutes old"
            description: >-
              Work is not draining: the oldest queued job has waited more than
              30 minutes. If JobsBridgeDown is also firing that is the cause;
              otherwise suspect a stuck dispatcher, a slow/stuck n8n workflow
              eating both dispatch slots, or priority starvation.
        - alert: JobsPvcDiskFilling
          expr: >-
            kubelet_volume_stats_used_bytes{namespace="jobs-mcp",persistentvolumeclaim="jobs-mcp-data"}
            / kubelet_volume_stats_capacity_bytes{namespace="jobs-mcp",persistentvolumeclaim="jobs-mcp-data"}
            > 0.80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "filesystem behind the jobs-mcp PVC is over 80% full"
            description: >-
              Under local-path this measures the NODE root filesystem, not the
              1Gi claim (which is unenforced) — so this is really "the k3s node
              disk is filling", observed from the volume that dies first when
              it fills (SQLite writes start failing; enqueue errors cleanly,
              liveness stays up by design). Baseline when wired 2026-09-01: 73%.
              Free node disk or grow the underlying disk; jobs-mcp itself
              rarely contributes (see JobsDbOversized for its share).
        - alert: JobsDbOversized
          expr: jobs_db_bytes{namespace="jobs-mcp"} > 0.8 * 1073741824
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "jobs.db exceeds 80% of the PVC's nominal 1Gi"
            description: >-
              The app-level complement to JobsPvcDiskFilling: local-path never
              enforces the 1Gi claim, so the DB crossing ~820MB means job
              volume has outgrown v1 assumptions (28KiB at wiring time).
              Investigate row growth before the node disk pays for it;
              terminal-row pruning is a deliberate destructive task, not
              automatic (spec §11).
