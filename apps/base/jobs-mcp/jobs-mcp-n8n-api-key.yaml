# Dedicated n8n API key (never the workbench's): used ONLY for the non-fatal
# startup check that registry workflows exist and are active (spec §6).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jobs-mcp-n8n-api-key
  namespace: jobs-mcp
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: jobs-mcp-n8n-api-key
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: k3s_jobs_mcp_n8n_api_key
        property: api_key
