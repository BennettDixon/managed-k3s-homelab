apiVersion: v1
kind: Service
metadata:
  name: jobs-mcp
  namespace: jobs-mcp
  annotations:
    # Tailnet-only exposure: clients call http://jobs-mcp/mcp (spec §2).
    tailscale.com/expose: "true"
    tailscale.com/hostname: "jobs-mcp"
spec:
  selector:
    app: jobs-mcp
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
