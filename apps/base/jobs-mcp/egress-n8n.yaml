apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: jobs-mcp
  annotations:
    # The tailscale operator rewires this ExternalName to an egress proxy
    # reaching the tailnet n8n node. The ts.net FQDN is NEVER committed
    # (decision 2026-08-30): Flux substitutes it from the on-cluster
    # `cluster-vars` secret in flux-system (created once, out of band —
    # see docs/runbooks/jobs-mcp.md).
    tailscale.com/tailnet-fqdn: "${N8N_TAILNET_FQDN}"
    # The operator owns spec.externalName after creation; without this,
    # Flux SSA would revert it every reconcile and break egress.
    kustomize.toolkit.fluxcd.io/ssa: Ignore
spec:
  type: ExternalName
  externalName: placeholder.jobs-mcp.svc.cluster.local
