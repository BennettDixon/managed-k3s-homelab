# Caller-token JSON map (inventory spec §2 — the house auth shape, third
# consumer after knowledge-mcp and the gateway): ONE SM secret whose entire
# value is {"sorter-01": "<token>", "bennett": "<token>"}. No `property` ON
# PURPOSE: the service wants the whole map as one env var and resolves
# caller_id -> class through callers.yaml. identify (PR 2) reads the same
# map, and its own entry by property, to call inventory back.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: card-sorter-caller-tokens
  namespace: card-sorter
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: card-sorter-caller-tokens
    creationPolicy: Owner
  data:
    - secretKey: tokens
      remoteRef:
        key: k3s_card_sorter_caller_tokens
