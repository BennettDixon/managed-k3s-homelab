# The inventory pod's Litestream sidecar (inventory spec §1b): the one file
# in the project that cannot be regenerated gets a continuous point-in-time
# replica on the bulk NAS, over SFTP by the tailnet name (never a LAN IP).
# The user's private key comes from the secret card-sorter-litestream,
# mounted at /ssh. The path is a dataset of its own, so a mirror prune can
# never touch it. Restore: docs/runbooks/card-sorter.md.
addr: ":9090"
dbs:
  - path: /data/inventory.db
    replicas:
      - type: sftp
        host: truenas-bulk-52tb:22
        user: litestream
        key-path: /ssh/id_ed25519
        path: /mnt/BulkPoolZ2/artifacts/card-sorter/litestream/inventory
        sync-interval: 1s
        snapshot-interval: 24h
        retention: 720h
