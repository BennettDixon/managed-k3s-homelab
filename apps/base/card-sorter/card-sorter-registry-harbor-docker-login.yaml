# Dedicated Harbor robot for pulling the card-sorter images (jobs-mcp /
# knowledge-mcp / gateway pattern; robot scoped to pull on the `card-sorter`
# project only, which holds both inventory and identify).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: card-sorter-registry-harbor-docker-login
  namespace: card-sorter
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: card-sorter-registry-harbor-docker-login
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"{{ .registryHost }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: registryHost
      remoteRef:
        key: k3s_harbor_docker_pull_card_sorter
        property: registry
    - secretKey: username
      remoteRef:
        key: k3s_harbor_docker_pull_card_sorter
        property: username
    - secretKey: password
      remoteRef:
        key: k3s_harbor_docker_pull_card_sorter
        property: password
