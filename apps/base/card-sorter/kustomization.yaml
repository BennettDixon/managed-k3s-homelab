apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: card-sorter
resources:
  # PR 1: inventory, the card-sorter's manifest store (spec: card-sorter
  # repo, docs/specs/inventory.md §6). One service per PR.
  - inventory-deployment.yaml
  - inventory-service.yaml
  - inventory-pvc.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  # ExternalSecrets live in this base, NOT apps/secrets/ (jobs-mcp,
  # knowledge-mcp, gateway precedent): apps/secrets is shared with the
  # development cluster, which has no card-sorter namespace. Legal ONLY
  # because this base is never added to apps/development.
  - card-sorter-caller-tokens.yaml
  - card-sorter-litestream.yaml
  - card-sorter-registry-harbor-docker-login.yaml
  # PR 2: identify, once its MERGE GATE holds (the NFS export mounted by the
  # node, the mirror complete, the image pushed): uncomment together.
  # - identify-deployment.yaml
  # - identify-service.yaml
  # - identify-pvc.yaml
  # - scryfall-mirror-pv.yaml
  # - scryfall-mirror-pvc.yaml
  # - scryfall-mirror-cronjob.yaml
  # - identify-cronjob.yaml
  # - card-sorter-identify-token.yaml
configMapGenerator:
  # Hash-suffixed: a caller-registry change rolls the Recreate Deployment
  # (the map is read at boot); a ConfigMap updated in place would go stale.
  - name: inventory-callers
    files:
      - callers.yaml
  # The Litestream sidecar's config; a change to the replica path or the
  # intervals rolls the pod the same way.
  - name: inventory-litestream
    files:
      - litestream.yml
