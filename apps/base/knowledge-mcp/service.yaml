apiVersion: v1
kind: Service
metadata:
  name: knowledge-mcp
  namespace: knowledge-mcp
  labels:
    # The ServiceMonitor selects Services by this label — without it the
    # monitor matches nothing and Prometheus silently never scrapes us.
    app: knowledge-mcp
  annotations:
    # Tailnet-only exposure: clients call http://knowledge-mcp/mcp (spec §2).
    tailscale.com/expose: "true"
    tailscale.com/hostname: "knowledge-mcp"
spec:
  selector:
    app: knowledge-mcp
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
