apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway
  namespace: gateway
  labels:
    # Without this label the default-valued kube-prometheus-stack silently
    # ignores the monitor (spec §9 — the thrice-hit trap).
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
