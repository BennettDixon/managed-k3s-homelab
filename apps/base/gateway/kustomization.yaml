apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway
resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  # ExternalSecrets live in this base, NOT apps/secrets/ (jobs-mcp and
  # knowledge-mcp precedent): apps/secrets is shared with the development
  # cluster, which has no gateway namespace. Legal ONLY because this base is
  # never added to apps/development (spec §8) — the alerts-wiring review drew
  # that line. This base holds the first dollar-spending credential on the
  # secret path; the ESO reader policy is the auditable list of where the
  # key can go (spec §7.2).
  - gateway-caller-tokens.yaml
  - gateway-anthropic-api-key.yaml
  - gateway-registry-harbor-docker-login.yaml
configMapGenerator:
  # Hash-suffixed: a registry change (a cap raise, a price update, a new
  # caller) rolls the Recreate Deployment (spec §4); a boot-read ConfigMap
  # updated in place would go silently stale.
  - name: gateway-registry
    files:
      - registry.yaml
