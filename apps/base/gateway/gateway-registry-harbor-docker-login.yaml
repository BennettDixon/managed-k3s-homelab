# Dedicated Harbor robot for pulling the gateway image (jobs-mcp /
# knowledge-mcp pattern; robot scoped to pull on the `gateway` project only).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-registry-harbor-docker-login
  namespace: gateway
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gateway-registry-harbor-docker-login
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"{{ .registryHost }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: registryHost
      remoteRef:
        key: k3s_harbor_docker_pull_gateway
        property: registry
    - secretKey: username
      remoteRef:
        key: k3s_harbor_docker_pull_gateway
        property: username
    - secretKey: password
      remoteRef:
        key: k3s_harbor_docker_pull_gateway
        property: password
