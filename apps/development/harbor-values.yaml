apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  chart:
    spec:
      # Pinned => update manually
      version: 1.16.1
  values:
    externalURL: https://harbor.internal
    # The name of the secret where to find harbor admin password
    existingSecretAdminPassword: harbor-admin-password
    # The name of the key in the secret where to find harbor admin password Harbor
    existingSecretAdminPasswordKey: harborAdminPassword
    expose:
      tls:
        # cert-manager owns the harbor-ingress TLS secret (requested via the
        # ingress annotation below). certSource "secret" stops the chart from
        # templating its own throwaway self-signed cert into the same secret
        # on every helm upgrade, which cert-manager then had to overwrite.
        certSource: secret
        secret:
          secretName: harbor-ingress
      ingress:
        controller: default
        enabled: true
        hosts:
          core: harbor.internal
          notary: notary.harbor.internal
        annotations:
          # homelab-ca issues leafs signed by the homelab-root-ca root, so
          # rotations keep validating for clients that trust the root once.
          cert-manager.io/cluster-issuer: "homelab-ca"
    persistence:
      persistentVolumeClaim:
        # Adjust based on your storage options
        registry:
          size: 5Gi
        redis:
          size: 1Gi
    redis:
      internal:
        # Adjust based on your resource options
        resources:
          memory: 256Mi
          cpu: 100m

